version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: monitor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monitor_dashboard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: monitor-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 通过环境变量接通容器内的 MySQL（覆盖 application-dev.yml 中的硬编码 localhost 数据源）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/monitor_dashboard?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # 接口鉴权总开关（默认关闭；生产部署建议设为 "true" 并对前端下发 Bearer Token）
      REQUIRE_AUTH: "false"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
